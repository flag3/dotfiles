customCommands:
  - key: "C"
    command: "git cz"
    description: "commit with commitizen"
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal
gui:
  mouseEvents: false
  scrollHeight: 30
git:
  autoFetch: false
  diffRenderers:
    - command: delta --light --paging=never --syntax-theme="Solarized (light)"
      colorArg: always
os:
  # fish syntax: lazygit runs this through $SHELL
  edit: 'if test -z "$NVIM"; nvim -- {{filename}}; else; nvim --server "$NVIM" --remote-send "<Cmd>lua User.lazygit.handoff()<CR>"; and nvim --server "$NVIM" --remote {{filename}}; end'
