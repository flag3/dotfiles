# vim: ft=tmux
set -g mode-style "fg=#073642,bg=#eee8d5"

set -g message-style "fg=#073642,bg=#eee8d5"
set -g message-command-style "fg=#073642,bg=#eee8d5"

set -g pane-border-style "fg=#eee8d5"
set -g pane-active-border-style "fg=#073642"

set -g status "on"
set -g status-interval 1
set -g status-justify "centre"


set -g status-style fg=#586e75,bg=default

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#073642,bg=#fdf6e3]#[fg=#eee8d5,bg=#073642,bold] #S:#I.#P #[fg=#073642,bg=#586e75,nobold,nounderscore,noitalics]#[fg=#eee8d5,bg=#586e75,bold] #(whoami) #[fg=#586e75,bg=#fdf6e3]"
set -g status-right "#[fg=#586e75,bg=#fdf6e3,nobold,nounderscore,noitalics]#[fg=#eee8d5,bg=#586e75,bold] #h #[fg=#586e75,bg=#fdf6e3]"

setw -g window-status-activity-style "underscore,fg=#657b83,bg=#fdf6e3"
setw -g window-status-bell-style "default"
setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=#657b83,bg=#fdf6e3"
setw -g window-status-format '#[fg=#{?window_bell_flag,##D33682,#b58900},bg=#fdf6e3]#[fg=#eee8d5,bg=#{?window_bell_flag,##D33682,#b58900},#{?window_bell_flag,bold,nobold}]#I #[fg=#073642,bg=#93a1a1] #{b:pane_current_path} #[fg=#93a1a1,bg=#fdf6e3]'
setw -g window-status-current-format '#[fg=#{?window_bell_flag,##D33682,#278BD3},bg=#fdf6e3]#[fg=#eee8d5,bg=#{?window_bell_flag,##D33682,#278BD3},bold]#I #[fg=#fdf6e3,bg=#073642,bold] #{b:pane_current_path} #[fg=#073642,bg=#fdf6e3]'
