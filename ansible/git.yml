- name: create agents directory
  file:
    state: directory
    path: ~/.agents
    mode: 0700

- name: clone/pull repositories
  ignore_errors: true
  git:
    repo: git@github.com:{{ item.repo }}.git
    dest: ~/{{ item.dest }}
  loop:
    - repo: flag3/skills
      dest: .claude/skills
    - repo: flag3/tmux-agent-session-manager
      dest: .config/tmux/plugins/tmux-agent-session-manager

- name: link repositories
  file:
    state: link
    src: ~/{{ item.src }}
    dest: ~/{{ item.dest }}
    force: true
    follow: false
  loop:
    - src: .claude/skills
      dest: .agents/skills
