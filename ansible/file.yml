- name: create directory
  file:
    state: directory
    path: ~/{{ item }}
    mode: 0700
  loop:
    - .agents
    - .config/aquaproj-aqua
    - .config/fish/completions
    - .config/fish/conf.d
    - .config/fish/functions
    - .config/ghostty
    - .config/git
    - .config/gwq
    - .config/herdr
    - .config/karabiner/assets
    - .config/lazygit
    - .config/mise
    - .config/nvim
    - .local/share
    - .ssh
    - bin

- name: link files
  file:
    state: link
    src: "{{ playbook_dir }}/../{{ item.src }}"
    dest: ~/{{ item.dest }}
    force: true
    follow: false
  loop:
    - src: .config/aquaproj-aqua/aqua.yaml
      dest: .config/aquaproj-aqua/aqua.yaml
    - src: .config/fish/conf.d/tide.fish
      dest: .config/fish/conf.d/tide.fish
    - src: .config/fish/config.fish
      dest: .config/fish/config.fish
    - src: .config/ghostty/config
      dest: .config/ghostty/config
    - src: .config/git/aliases.gitconfig
      dest: .config/git/aliases.gitconfig
    - src: .config/git/delta.gitconfig
      dest: .config/git/delta.gitconfig
    - src: .config/git/ghq.gitconfig
      dest: .config/git/ghq.gitconfig
    - src: .config/gwq/config.toml
      dest: .config/gwq/config.toml
    - src: .config/herdr/config.toml
      dest: .config/herdr/config.toml
    - src: .config/karabiner
      dest: .config/karabiner/assets/complex_modifications
    - src: .config/lazygit/config.yml
      dest: .config/lazygit/config.yml
    - src: .config/mise/config.toml
      dest: .config/mise/config.toml
    - src: .config/nvim/after
      dest: .config/nvim/after
    - src: .config/nvim/init.lua
      dest: .config/nvim/init.lua
    - src: .config/nvim/lua
      dest: .config/nvim/lua
    - src: .config/tmux
      dest: .config/tmux
    - src: .czrc
      dest: .czrc
    - src: .gitconfig
      dest: .gitconfig
    - src: .gitignore
      dest: .gitignore
    - src: .latexmkrc
      dest: .latexmkrc
    - src: .npmrc
      dest: .npmrc
    - src: .scripts/herdr-move-workspace
      dest: bin/herdr-move-workspace
    - src: .scripts/ide
      dest: bin/ide
    - src: .ssh/config
      dest: .ssh/config

- name: link fish completions and functions
  file:
    state: link
    src: "{{ item }}"
    dest: ~/.config/fish/{{ item | dirname | basename }}/{{ item | basename }}
    force: true
    follow: false
  with_fileglob:
    - "{{ playbook_dir }}/../.config/fish/completions/*"
    - "{{ playbook_dir }}/../.config/fish/functions/*"
